      - standard: and
        table: population
        match_on: CPR_BARN
        column: GA
        operator: <
        value: ${preterm_cutoff}
      - standard: and
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: PPROM
        operator: not_in
