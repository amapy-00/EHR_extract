      - standard: and
        table: population
        match_on: CPR_BARN
        column: GA
        operator: <
        value: ${preterm_cutoff}
      - custom: and 
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: [DO420, DO422, DO424]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/mor_diagnoser.csv
          value_column: DiagnoseKode
          value_table_birth_id_column: DW_EK_Foedsel
          mapping_table_path: ${paths.input_dir_SDS}/nyfoedte.csv
          mapping_table_birth_id_column: DW_EK_Foedsel
          mapping_table_child_cpr_column: CPRnummer_Barn
      - custom: and 
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: [DO420, DO422, DO424]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/mor_procedurer.csv
          value_column: ProcedureKode
          value_table_birth_id_column: DW_EK_Foedsel
          mapping_table_path: ${paths.input_dir_SDS}/nyfoedte.csv
          mapping_table_birth_id_column: DW_EK_Foedsel
          mapping_table_child_cpr_column: CPRnummer_Barn
      - custom: and 
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args: 
          value: [DO420, DO422, DO424]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/t_diag.csv
          value_column: C_DIAG
          value_id_column: V_RECNUM
          value_time_column: D_INDDTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      - custom: and 
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args: 
          value: [DO420, DO422, DO424]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/t_diag.csv
          value_column: C_TILDIAG
          value_id_column: V_RECNUM
          value_time_column: D_INDDTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      - custom: and 
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args: 
          value: [DO420, DO422, DO424]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/t_sksopr.csv
          value_column: C_TILOPR
          value_id_column: V_RECNUM
          value_time_column: D_ODTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
  # ======================================================================================
  # CRITERION 5/6: No triplets or higher-order multiples (twins and singletons are KEPT)  (5 OR-groups, action: exclude)
  # ======================================================================================
  # A birth is excluded if ANY of these sources shows 3 or more babies:
  #   - 3 or more newborns registered for the same birth (count of children per birth):
  #       nyfoedte: same DW_EK_Foedsel + mother        mfr: same FOEDSELSLOEBENUMMER + mother
  #     (needs min_count in find_duplicated_ids - see find_duplicated_ids_min_count.patch)
  #   - an ICD-10 code for a triplet+ pregnancy or delivery, in mor_diagnoser or LPR (t_diag) during the pregnancy:
  #       DO301 triplet pregnancy, DO302 quadruplet pregnancy, DO308 other multiple gestation (3+),
  #       DZ375 / DZ376 / DZ377 outcome of delivery: other multiple births (3+) all / some / none liveborn
  #     (DO300 twin pregnancy and DZ372-DZ374 twin outcomes are NOT in the list: twins are kept)
  - action: exclude
    conditions:
      # --- [5.1] OR-group 1/5: nyfoedte: >= 3 children registered for the same birth
      - custom:
        function: find_duplicated_ids
        args:
          table: ${paths.input_dir_SDS}/nyfoedte.csv
          match_on: CPRnummer_Barn
          id_columns:
          - DW_EK_Foedsel
          - CPRnummer_Mor
          min_count: 3
      # --- [5.2] OR-group 2/5: mfr: >= 3 children registered for the same birth
      - custom: or
        function: find_duplicated_ids
        args:
          table: ${paths.input_dir_SDS}/mfr.csv
          match_on: CPR_BARN
          id_columns:
          - FOEDSELSLOEBENUMMER
          - CPR_MODER
          min_count: 3
      # --- [5.3] OR-group 3/5: mor_diagnoser: triplet+ diagnosis linked to the birth
      - custom: or
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: [DO301, DO302, DO308, DZ375, DZ376, DZ377]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SDS}/mor_diagnoser.csv
          value_column: DiagnoseKode
          value_table_birth_id_column: DW_EK_Foedsel
          mapping_table_path: ${paths.input_dir_SDS}/nyfoedte.csv
          mapping_table_birth_id_column: DW_EK_Foedsel
          mapping_table_child_cpr_column: CPRnummer_Barn
      # --- [5.4] OR-group 4/5: LPR diagnosis: triplet+ code during the pregnancy
      - custom: or
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args:
          value: [DO301, DO302, DO308, DZ375, DZ376, DZ377]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SDS}/t_diag.csv
          value_column: C_DIAG
          value_id_column: V_RECNUM
          value_time_column: D_INDDTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      # --- [5.5] OR-group 5/5: LPR additional diagnosis: triplet+ code during the pregnancy
      - custom: or
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args:
          value: [DO301, DO302, DO308, DZ375, DZ376, DZ377]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SDS}/t_diag.csv
          value_column: C_TILDIAG
          value_id_column: V_RECNUM
          value_time_column: D_INDDTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
  # ======================================================================================
  # CRITERION 6/6: Mother 18 or older at the birth  (action: INCLUDE - keep only the children that match)
  # ======================================================================================
  # MOTHER_AGE is a population column (like GA), so every child has it.
  # ">=" turns the value into a number first: an EMPTY or non-numeric age is then "no number" and does not
  # match, so these children are excluded too (just like a mother younger than 18).
  # (The registers are read as text, so an empty age is an empty text "", which operator "missing" would
  # NOT catch - this is why the rule is written as "keep >= 18" and not as "exclude missing or < 18".)
  # NOTE: this is the age AT THE BIRTH. The age ON THE DAY OF THE SCAN is checked by the image step
  # find_images_with_min_mother_age_at_scan below, where the mother's birth date is known (nyfoedte).
  - action: include
    conditions:
      # --- [6.1] the mother's age at the birth is a number >= 18
      - standard:
        table: population
        match_on: CPR_BARN
        column: MOTHER_AGE
        operator: ">="
        value: 18

  # --------------------------------------------------------------------------------------
  # OPTIONAL (switched off): upper GA-at-birth limit for the NEGATIVES, e.g. 294 = born before 42+0.
  # To switch it on, remove the "# " in front of the 8 lines below and set value.
  # --------------------------------------------------------------------------------------
  # - action: exclude
  #   conditions:
  #     - standard:
  #       table: population
  #       match_on: CPR_BARN
  #       column: GA
  #       operator: ">"
  #       value: 294

imaging_table:
  table: ${paths.imaging_table}
  columns:
    CPR_MOR: phair_hash
    FILE_PATH: file_path
    STUDY_DATE: study_date
    PDX: physical_delta_x
    PDY: physical_delta_y
    NO_OCR_FILE_PATH: no_ocr_preprocessed_file_path
    INSTITUTION_NAME: institution_name


imaging_matching_criteria:
  # ------------------------------------------------------------------------------------
  # a. GA at scan 16+0 to 31+6 weeks, scan 1-209 days before birth.
  #    The bounds are STRICT in the code: 111 < GA at scan < 224 keeps 112-223 days (16+0 to 31+6)
  #    and 0 < days from scan to birth < 210 keeps scans 1-209 days before birth.
  # ------------------------------------------------------------------------------------
  - function: find_images_within_time_windows
    args:
      scan_date_column: STUDY_DATE
      image_path_column: ${population.file_path_key}
      population_delivery_date_column: BIRTHDAY
      population_ga_in_days_at_delivery_column: GA
      min_diff_days_scan_to_delivery: 0
      max_diff_days_scan_to_delivery: 210
      min_ga_in_days_at_scan: 111
      max_ga_in_days_at_scan: 224

  # ------------------------------------------------------------------------------------
  # b. Only images taken BEFORE a cervical cerclage (same pregnancy). Per pregnancy:
  #   - dated cerclage PLACEMENT found -> keep only images taken before the earliest placement date
  #                                       (images on the day of the cerclage are removed)
  #   - cerclage found but no placement date (removal code, diagnosis, or a source without dates)
  #                                    -> ALL images of that pregnancy are removed (never keep a post-cerclage image)
  #   - no cerclage                    -> all images kept
  # ------------------------------------------------------------------------------------
  - function: find_images_before_event
    args:
      event_name: cerclage
      keep_same_day: false
      sources:
        # LPR operations, placement on the pregnant uterus: the operation date is the cerclage date
        - {table: "${paths.input_dir_SDS}/t_sksopr.csv", code_column: C_OPR, codes: [KMAB00, KMAB01],
           link: lpr, id_column: V_RECNUM, date_column: D_ODTO, date_is_placement: true,
           mapping_table: "${paths.input_dir_SDS}/t_adm.csv", mapping_id_column: K_RECNUM, mapping_mother_column: V_CPR}
        # LPR operations, abdominal / laparoscopic placement: often done BEFORE the pregnancy and left in place,
        # so placements up to 2 years before the pregnancy started also count (-> all images are after it)
        - {table: "${paths.input_dir_SDS}/t_sksopr.csv", code_column: C_OPR, codes: [KLDD10A, KLDD10B],
           link: lpr, id_column: V_RECNUM, date_column: D_ODTO, date_is_placement: true, lookback_days: 730,
           mapping_table: "${paths.input_dir_SDS}/t_adm.csv", mapping_id_column: K_RECNUM, mapping_mother_column: V_CPR}
        # LPR operations, REMOVAL of the cerclage: proves a cerclage, but the date is the removal, not the placement
        - {table: "${paths.input_dir_SDS}/t_sksopr.csv", code_column: C_OPR, codes: [KMAB03, KLDD20],
           link: lpr, id_column: V_RECNUM, date_column: D_ODTO, date_is_placement: false,
           mapping_table: "${paths.input_dir_SDS}/t_adm.csv", mapping_id_column: K_RECNUM, mapping_mother_column: V_CPR}
        # LPR diagnosis: D_INDDTO is the ADMISSION date of the contact, not the day of the cerclage
        - {table: "${paths.input_dir_SDS}/t_diag.csv", code_column: C_DIAG, codes: [DO343C],
           link: lpr, id_column: V_RECNUM, date_column: D_INDDTO, date_is_placement: false,
           mapping_table: "${paths.input_dir_SDS}/t_adm.csv", mapping_id_column: K_RECNUM, mapping_mother_column: V_CPR}
        # Birth-linked procedures (also after 2019). date_column: null = no date known yet. If mor_procedurer has a
        # procedure date column, put its name in date_column of the PLACEMENT line (the removal line stays false).
        - {table: "${paths.input_dir_SDS}/mor_procedurer.csv", code_column: ProcedureKode,
           codes: [KMAB00, KMAB01, KLDD10A, KLDD10B], link: birth_id, birth_id_column: DW_EK_Foedsel,
           date_column: null, date_is_placement: true,
           mapping_table: "${paths.input_dir_SDS}/nyfoedte.csv", mapping_birth_id_column: DW_EK_Foedsel,
           mapping_child_column: CPRnummer_Barn}
        - {table: "${paths.input_dir_SDS}/mor_procedurer.csv", code_column: ProcedureKode, codes: [KMAB03, KLDD20],
           link: birth_id, birth_id_column: DW_EK_Foedsel, date_column: null, date_is_placement: false,
           mapping_table: "${paths.input_dir_SDS}/nyfoedte.csv", mapping_birth_id_column: DW_EK_Foedsel,
           mapping_child_column: CPRnummer_Barn}
        # Birth-linked diagnosis
        - {table: "${paths.input_dir_SDS}/mor_diagnoser.csv", code_column: DiagnoseKode, codes: [DO343C],
           link: birth_id, birth_id_column: DW_EK_Foedsel, date_column: null, date_is_placement: false,
           mapping_table: "${paths.input_dir_SDS}/nyfoedte.csv", mapping_birth_id_column: DW_EK_Foedsel,
           mapping_child_column: CPRnummer_Barn}

  # ------------------------------------------------------------------------------------
  # c. Only images the cervix classifier labels as cervix (is_cervix = 1)
  # ------------------------------------------------------------------------------------
  - function: find_images_with_predicted_classes
    args:
      table: ${paths.img_sequence_predictions}
      classes: [1]
      image_path_column: file_path
      class_column: is_cervix
      population_image_path_column: ${population.file_path_key}

  # ------------------------------------------------------------------------------------
  # d. Mother 18 or older ON THE DAY OF THE SCAN. Only possible where her birth date is known
  #    (MOTHER_BIRTHDAY, from nyfoedte); for the other mothers only the age AT BIRTH is known,
  #    which criterion 6 checked (a mother who was 17 at the scan but 18 at the birth is then not detected).
  # ------------------------------------------------------------------------------------
  - function: find_images_with_min_mother_age_at_scan
    args:
      min_age: 18
      mother_birthday_column: MOTHER_BIRTHDAY
      scan_date_column: STUDY_DATE

  # ------------------------------------------------------------------------------------
  # e. OPTIONAL: only scans from year_from to year_to (both included). null = no limit = all years.
  # ------------------------------------------------------------------------------------
  - function: find_images_in_scan_years
    args:
      year_from: null
      year_to: null
      scan_date_column: STUDY_DATE

  # ------------------------------------------------------------------------------------
  # f. Twins share their mother's images: keep every image only once
  # ------------------------------------------------------------------------------------
  - function: keep_one_row_per_image
    args:
      image_path_column: ${population.file_path_key}

  # ------------------------------------------------------------------------------------
  # g. Label: positive = born at GA <= 224 days (32+0), negative = born later (>= 32+1). Removes nothing.
  # ------------------------------------------------------------------------------------
  - function: add_label_by_ga_at_birth
    args:
      positive_max_ga_at_birth: 224
      ga_column: GA
      label_column: label