          population_mom_cpr_column: CPR_MOR
  # ======================================================================================
  # CRITERION 4/6: No iatrogenic preterm induction  (4 OR-groups, action: exclude)
  # ======================================================================================
  # Not induced 
  - action: exclude
    conditions:
      # --- [4.1] OR-group 1/4: mfr induction marker AND preterm AND no PPROM code
      - standard:
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: MARKOER_IGANGSAETTELSE  # == MARKER_INITIALIZATION
        operator: "=="
