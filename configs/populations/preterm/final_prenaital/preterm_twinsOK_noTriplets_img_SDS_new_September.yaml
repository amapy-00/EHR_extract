  columns:
    CPR_MOR: phair_hash
    FILE_PATH: file_path
    STUDY_DATE: study_date
    PDX: physical_delta_x
    PDY: physical_delta_y
    NO_OCR_FILE_PATH: no_ocr_preprocessed_file_path
    INSTITUTION_NAME: institution_name


imaging_matching_criteria:
  # ------------------------------------------------------------------------------------
  # Only images taken BEFORE a cervical cerclage (same pregnancy). Per pregnancy:
  #   - dated cerclage PLACEMENT found -> keep only images taken before the earliest placement date
  #                                       (images on the day of the cerclage are removed)
  #   - cerclage found but no placement date (removal code, diagnosis, or a source without dates)
  #                                    -> ALL images of that pregnancy are removed (never keep a post-cerclage image)
  #   - no cerclage                    -> all images kept
  # ------------------------------------------------------------------------------------
  - function: find_images_before_event
    args:
      event_name: cerclage
      keep_same_day: false
      sources:
        # LPR operations, placement on the pregnant uterus: the operation date is the cerclage date
        - {table: "${paths.input_dir_SDS}/t_sksopr.csv", code_column: C_OPR, codes: [KMAB00, KMAB01],
           link: lpr, id_column: V_RECNUM, date_column: D_ODTO, date_is_placement: true,
           mapping_table: "${paths.input_dir_SDS}/t_adm.csv", mapping_id_column: K_RECNUM, mapping_mother_column: V_CPR}
        # LPR operations, abdominal / laparoscopic placement: often done BEFORE the pregnancy and left in place,
        # so placements up to 2 years before the pregnancy started also count (-> all images are after it)
        - {table: "${paths.input_dir_SDS}/t_sksopr.csv", code_column: C_OPR, codes: [KLDD10A, KLDD10B],
           link: lpr, id_column: V_RECNUM, date_column: D_ODTO, date_is_placement: true, lookback_days: 730,
           mapping_table: "${paths.input_dir_SDS}/t_adm.csv", mapping_id_column: K_RECNUM, mapping_mother_column: V_CPR}
        # LPR operations, REMOVAL of the cerclage: proves a cerclage, but the date is the removal, not the placement
        - {table: "${paths.input_dir_SDS}/t_sksopr.csv", code_column: C_OPR, codes: [KMAB03, KLDD20],
           link: lpr, id_column: V_RECNUM, date_column: D_ODTO, date_is_placement: false,
           mapping_table: "${paths.input_dir_SDS}/t_adm.csv", mapping_id_column: K_RECNUM, mapping_mother_column: V_CPR}
        # LPR diagnosis: D_INDDTO is the ADMISSION date of the contact, not the day of the cerclage
        - {table: "${paths.input_dir_SDS}/t_diag.csv", code_column: C_DIAG, codes: [DO343C],
           link: lpr, id_column: V_RECNUM, date_column: D_INDDTO, date_is_placement: false,
           mapping_table: "${paths.input_dir_SDS}/t_adm.csv", mapping_id_column: K_RECNUM, mapping_mother_column: V_CPR}
        # Birth-linked procedures (also after 2019). date_column: null = no date known yet. If mor_procedurer has a
        # procedure date column, put its name in date_column of the PLACEMENT line (the removal line stays false).
        - {table: "${paths.input_dir_SDS}/mor_procedurer.csv", code_column: ProcedureKode,
           codes: [KMAB00, KMAB01, KLDD10A, KLDD10B], link: birth_id, birth_id_column: DW_EK_Foedsel,
           date_column: null, date_is_placement: true,
           mapping_table: "${paths.input_dir_SDS}/nyfoedte.csv", mapping_birth_id_column: DW_EK_Foedsel,
           mapping_child_column: CPRnummer_Barn}
        - {table: "${paths.input_dir_SDS}/mor_procedurer.csv", code_column: ProcedureKode, codes: [KMAB03, KLDD20],
           link: birth_id, birth_id_column: DW_EK_Foedsel, date_column: null, date_is_placement: false,
           mapping_table: "${paths.input_dir_SDS}/nyfoedte.csv", mapping_birth_id_column: DW_EK_Foedsel,
           mapping_child_column: CPRnummer_Barn}
        # Birth-linked diagnosis
        - {table: "${paths.input_dir_SDS}/mor_diagnoser.csv", code_column: DiagnoseKode, codes: [DO343C],
           link: birth_id, birth_id_column: DW_EK_Foedsel, date_column: null, date_is_placement: false,
           mapping_table: "${paths.input_dir_SDS}/nyfoedte.csv", mapping_birth_id_column: DW_EK_Foedsel,
           mapping_child_column: CPRnummer_Barn}

  # Optional: keep only images the cervix classifier labels as cervix (not part of the stated requirements).
  # Remove the "#" in front of the 7 lines below to switch it on.
  - function: find_images_with_predicted_classes
    args:
      table: ${paths.img_sequence_predictions}
      classes: [1]
      image_path_column: file_path
      class_column: is_cervix
      population_image_path_column: ${population.file_path_key}
