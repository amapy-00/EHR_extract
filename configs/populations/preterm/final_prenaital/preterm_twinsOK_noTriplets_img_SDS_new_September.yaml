# =====================================================================================
# preterm_twinsOK_noTriplets_img_SDS_new_September          (DATASET: new_September)
# One-run extraction. Population: children in mfr + nyfoedte, paired with the mother's ultrasound images.
# Criteria (in this order):
#   1. GA available at birth  (together with the image pairing this gives GA AT SCAN for every image:
#      GA at scan = GA at birth - (birth date - study date))
#   2. Only live births
#   3. No iatrogenic PRETERM C-section    (exemptions: PPROM / preterm labour / intrapartum C-section codes)
#   4. No iatrogenic PRETERM induction    (exemption: PPROM codes)
#   5. No cervical cerclage               (whole pregnancy; date exception NOT implemented - see criterion 5)
#   6. No triplets or more                (singletons AND TWINS are kept)
# Changes vs the earlier cohorts: no parity criterion, no progesterone criterion, twins are kept.
# Then: every child is paired with all of the mother's images taken during the pregnancy
#       (birth date - GA up to birth date); mother ID in the image database = phair_hash.
#       Twins share the mother's images: each image appears once per twin (one row per child-image).
# Requires: find_duplicated_ids with min_count (find_duplicated_ids_min_count.patch) - criterion 6.
# Run: python EHR_extract/extract.py --config-name preterm_twinsOK_noTriplets_img_SDS_new_September
# =====================================================================================
# @package _global_
defaults:
  - /default@
  - _self_

paths:
  input_dir_SDS: /home/am/data/raw/sds
  output_dir: /home/am/Documents/output_cohort/filtering_steps_SDS/new_September/${hydra:job.config_name}
  population_save_path: /home/am/Documents/final_population/${hydra:job.config_name}_population
  discards_save_path: /home/am/Documents/final_population/${hydra:job.config_name}_discards
  holdout_csv:   # test-split file (one column CPR_MOR) to also write _train.csv / _test.csv, e.g.
                 # /projects/users/data/UCPH/DeepFetal/projects/common/splits/split_V4/test_split_0.15_2026-06-08.csv
  imaging_table: /home/am/Documents/DeepFetalCSVs/new_September/DeepFetal_image_database_090926_joined_on_sop_instance_uid_and_xx-file_hash.csv
  img_sequence_predictions: /home/am/data/raw/research_common/cervix_preds_v3.csv

strict: True
preterm_cutoff: 259  # == 37 weeks. Used by the C-section and induction criteria.

population: 
  population_key: CPR_BARN
  split_key: CPR_MOR
  file_path_key: FILE_PATH
  deduplication_key: CPR_BARN
  tables: 
    - table: ${paths.input_dir_SDS}/mfr.csv
      columns:
        CPR_BARN: CPR_BARN
        CPR_MOR: CPR_MODER
        GA: GESTATIONSALDER_DAGE
        BIRTHDAY: FOEDSELSDATO
    - table: ${paths.input_dir_SDS}/nyfoedte.csv
      columns:
        CPR_BARN: CPRnummer_Barn
        CPR_MOR: CPRnummer_Mor
        GA: Gestationsalder
        BIRTHDAY: FoedselsDato_Barn

conditional_criteria:
  # ======================================================================================
  # CRITERION 1/6: GA available at birth  (1 OR-group, action: exclude)
  # ======================================================================================
  # GA available at birth
  - action: exclude
    conditions: 
      # --- [1.1] OR-group 1/1: population: GA missing
      - standard:
        table: population
        match_on: CPR_BARN
        column: GA
        operator: "missing"
        value: 
  # ======================================================================================
  # CRITERION 2/6: Only live births  (2 OR-groups, action: exclude)
  # ======================================================================================
  # Only live birth (no SP)
  - action: exclude
    conditions:
      # --- [2.1] OR-group 1/2: mfr: not live-born
      - standard:
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: LEVENDE_ELLER_DOEDFOEDT
        operator: "!="
        value: Levendefødt  # == live birth
      # --- [2.2] OR-group 2/2: nyfoedte: not live-born (1 = live)
      - standard: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: LevendefoedtDoedfoedt  # == live-born/still-born
        operator: "!="
        value: "1"
  # ======================================================================================
  # CRITERION 3/6: No iatrogenic preterm C-section  (3 OR-groups, action: exclude)
  # ======================================================================================
  # No C-section/kejsersnit unless PPROM or Contractions or C-section during birth
  - action: exclude
    conditions:
      # --- [3.1] OR-group 1/3: nyfoedte C-section (Kejsersnit != -1) AND preterm AND no PPROM/labour/intrapartum-CS code
      - standard:
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Kejsersnit  # == C-section
        operator: "!="
        value: "-1"
      - standard: and
        table: population
        match_on: CPR_BARN
        column: GA
        operator: <
        value: ${preterm_cutoff}
      - custom: and 
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: [DO420, DO422, DO424, DO601, KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/mor_diagnoser.csv
          value_column: DiagnoseKode
          # DW_EK_Foedsel: Key used to identify each individual birth. The key can be used 
          # to link to data in the satellite tables for the mother. For reports concerning 
          # unique births (as opposed to unique newborns), the main table must be filtered 
          # to ‘Foedsel = 1’.
          value_table_birth_id_column: DW_EK_Foedsel
          mapping_table_path: ${paths.input_dir_SDS}/nyfoedte.csv
          mapping_table_birth_id_column: DW_EK_Foedsel
          mapping_table_child_cpr_column: CPRnummer_Barn
      - custom: and 
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: [DO420, DO422, DO424, DO601, KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/mor_procedurer.csv
          value_column: ProcedureKode
          value_table_birth_id_column: DW_EK_Foedsel
          mapping_table_path: ${paths.input_dir_SDS}/nyfoedte.csv
          mapping_table_birth_id_column: DW_EK_Foedsel
          mapping_table_child_cpr_column: CPRnummer_Barn
      - custom: and 
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args: 
          value: [DO420, DO422, DO424, DO601, KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/t_diag.csv
          value_column: C_DIAG
          value_id_column: V_RECNUM
          value_time_column: D_INDDTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      - custom: and 
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args: 
          value: [DO420, DO422, DO424, DO601, KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/t_diag.csv
          value_column: C_TILDIAG
          value_id_column: V_RECNUM
          value_time_column: D_INDDTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      - custom: and 
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args: 
          value: [KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/t_sksopr.csv
          value_column: C_OPR
          value_id_column: V_RECNUM
          value_time_column: D_ODTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      - custom: and 
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args: 
          value: [DO420, DO422, DO424, KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/t_sksopr.csv
          value_column: C_TILOPR
          value_id_column: V_RECNUM
          value_time_column: D_ODTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      # --- [3.2] OR-group 2/3: mfr C-section marker AND preterm AND no PPROM code
      - standard: or
