          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
  # ======================================================================================
  # CRITERION 5/6: No cervical cerclage  (4 OR-groups, action: exclude)
  # ======================================================================================
  # Excluded if any of these is recorded for the pregnancy (LPR sources: birth date - GA up to birth date;
  # mor_* sources: linked to the birth through DW_EK_Foedsel):
  # NOTE: this excludes the whole pregnancy, whatever the DATE of the cerclage. The exception
  # "unless performed before image acquisition" needs an image-level date comparison that the
  # pipeline does not have yet - see the explanation that came with this file.
  #   diagnosis DO343C                  in mor_diagnoser.DiagnoseKode, t_diag.C_DIAG
  #   procedure KLDD10A, KLDD10B, KMAB00, KMAB01, KLDD20, KMAB03
  #                                     in mor_procedurer.ProcedureKode, t_sksopr.C_OPR
  - action: exclude
    conditions:
      # --- [5.1] OR-group 1/4: mor_diagnoser DiagnoseKode == DO343C
      - custom:
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: "DO343C"
          operator: ["==", any]
          value_table_path: ${paths.input_dir_SDS}/mor_diagnoser.csv
          value_column: DiagnoseKode
          value_table_birth_id_column: DW_EK_Foedsel
          mapping_table_path: ${paths.input_dir_SDS}/nyfoedte.csv
          mapping_table_birth_id_column: DW_EK_Foedsel
          mapping_table_child_cpr_column: CPRnummer_Barn
      # --- [5.2] OR-group 2/4: t_diag C_DIAG == DO343C
      - custom: or
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args:
          value: "DO343C"
          operator: ["==", any]
          value_table_path: ${paths.input_dir_SDS}/t_diag.csv
          value_column: C_DIAG
          value_id_column: V_RECNUM
          value_time_column: D_INDDTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      # --- [5.3] OR-group 3/4: mor_procedurer ProcedureKode in cerclage codes
      - custom: or
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: [KLDD10A, KLDD10B, KMAB00, KMAB01, KLDD20, KMAB03]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SDS}/mor_procedurer.csv
          value_column: ProcedureKode
          value_table_birth_id_column: DW_EK_Foedsel
          mapping_table_path: ${paths.input_dir_SDS}/nyfoedte.csv
          mapping_table_birth_id_column: DW_EK_Foedsel
          mapping_table_child_cpr_column: CPRnummer_Barn
      # --- [5.4] OR-group 4/4: t_sksopr C_OPR in cerclage codes
      - custom: or
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args:
          value: [KLDD10A, KLDD10B, KMAB00, KMAB01, KLDD20, KMAB03]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SDS}/t_sksopr.csv
          value_column: C_OPR
          value_id_column: V_RECNUM
          value_time_column: D_ODTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
  # ======================================================================================
  # CRITERION 6/6: No triplets or higher-order multiples (twins and singletons are KEPT)  (5 OR-groups, action: exclude)
  # ======================================================================================
  # A birth is excluded if ANY of these sources shows 3 or more babies:
  #   - 3 or more newborns registered for the same birth (count of children per birth):
  #       nyfoedte: same DW_EK_Foedsel + mother        mfr: same FOEDSELSLOEBENUMMER + mother
  #     (needs min_count in find_duplicated_ids - see find_duplicated_ids_min_count.patch)
  #   - an ICD-10 code for a triplet+ pregnancy or delivery, in mor_diagnoser or LPR (t_diag) during the pregnancy:
  #       DO301 triplet pregnancy, DO302 quadruplet pregnancy, DO308 other multiple gestation (3+),
  #       DZ375 / DZ376 / DZ377 outcome of delivery: other multiple births (3+) all / some / none liveborn
  #     (DO300 twin pregnancy and DZ372-DZ374 twin outcomes are NOT in the list: twins are kept)
  - action: exclude
    conditions:
      # --- [6.1] OR-group 1/5: nyfoedte: >= 3 children registered for the same birth
      - custom:
        function: find_duplicated_ids
        args:
          table: ${paths.input_dir_SDS}/nyfoedte.csv
          match_on: CPRnummer_Barn
          id_columns:
          - DW_EK_Foedsel
          - CPRnummer_Mor
          min_count: 3
      # --- [6.2] OR-group 2/5: mfr: >= 3 children registered for the same birth
      - custom: or
        function: find_duplicated_ids
        args:
          table: ${paths.input_dir_SDS}/mfr.csv
          match_on: CPR_BARN
          id_columns:
          - FOEDSELSLOEBENUMMER
          - CPR_MODER
          min_count: 3
      # --- [6.3] OR-group 3/5: mor_diagnoser: triplet+ diagnosis linked to the birth
      - custom: or
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: [DO301, DO302, DO308, DZ375, DZ376, DZ377]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SDS}/mor_diagnoser.csv
          value_column: DiagnoseKode
          value_table_birth_id_column: DW_EK_Foedsel
          mapping_table_path: ${paths.input_dir_SDS}/nyfoedte.csv
          mapping_table_birth_id_column: DW_EK_Foedsel
          mapping_table_child_cpr_column: CPRnummer_Barn
      # --- [6.4] OR-group 4/5: LPR diagnosis: triplet+ code during the pregnancy
      - custom: or
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args:
          value: [DO301, DO302, DO308, DZ375, DZ376, DZ377]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SDS}/t_diag.csv
          value_column: C_DIAG
          value_id_column: V_RECNUM
          value_time_column: D_INDDTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      # --- [6.5] OR-group 5/5: LPR additional diagnosis: triplet+ code during the pregnancy
      - custom: or
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args:
          value: [DO301, DO302, DO308, DZ375, DZ376, DZ377]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SDS}/t_diag.csv
          value_column: C_TILDIAG
          value_id_column: V_RECNUM
          value_time_column: D_INDDTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR

