          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/t_diag.csv
          value_column: C_TILDIAG
          value_id_column: V_RECNUM
          value_time_column: D_INDDTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      - custom: and 
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args: 
          value: [KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/t_sksopr.csv
          value_column: C_OPR
          value_id_column: V_RECNUM
          value_time_column: D_ODTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      - custom: and 
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args: 
          value: [DO420, DO422, DO424, KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/t_sksopr.csv
          value_column: C_TILOPR
          value_id_column: V_RECNUM
          value_time_column: D_ODTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
