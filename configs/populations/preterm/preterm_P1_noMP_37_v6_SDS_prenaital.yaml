  # ======================================================================================
  # CRITERION 5/7: No close siblings  (2 OR-groups, action: exclude)
  # ======================================================================================
  # Remove close siblings (no SP)
  - action: exclude
    conditions:
      # --- [5.1] OR-group 1/2: nyfoedte: another birth to same mother < 280 days apart
      - custom:
        function: find_close_births
        args:
          value: 280
          operator: <
          table: ${paths.input_dir_SDS}/nyfoedte.csv
          match_on: CPRnummer_Barn
          mom_column: CPRnummer_Mor
          birth_id_column: DW_EK_Foedsel
          delivery_date_column: FoedselsDato_Barn
      # --- [5.2] OR-group 2/2: mfr: another birth to same mother < 280 days apart
      - custom: or
        function: find_close_births        
        args:
          value: 280
          operator: <
          table: ${paths.input_dir_SDS}/mfr.csv
          match_on: CPR_BARN
          mom_column: CPR_MODER
          birth_id_column: FOEDSELSLOEBENUMMER
          delivery_date_column: FOEDSELSDATO
  # ======================================================================================
  # CRITERION 6/7: Only first pregnancy (parity 1)  (2 OR-groups, action: exclude)
  # ======================================================================================
  # Only first pregnancy 
  # Here we could potentially include null or "." as parity 1, but currently they are dropped.
  # SDS: 1 = first pregnancy
  # SP: 0 = first pregnancy (but many mistakes so often 1 == first pregnancy as well)
  - action: exclude
    conditions:
      # --- [6.1] OR-group 1/2: mfr: PARITET != 1
      - standard:
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: PARITET
        operator: "!="
        value: "1"
      # --- [6.2] OR-group 2/2: nyfoedte: Paritet != 1
      - standard: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Paritet
        operator: "!="
        value: "1"
  # ======================================================================================
  # CRITERION 7/7: No multiple births  (2 OR-groups, action: exclude)
  # ======================================================================================
  # Remove multiple births (twins etc.)
  - action: exclude
    conditions:
      # --- [7.1] OR-group 1/2: nyfoedte: twins (shared DW_EK_Foedsel + mother)
      - custom:
        function: find_duplicated_ids
        args: 
          table: ${paths.input_dir_SDS}/nyfoedte.csv
          match_on: CPRnummer_Barn
          id_columns: 
          - DW_EK_Foedsel
          - CPRnummer_Mor
      # --- [7.2] OR-group 2/2: mfr: twins (shared FOEDSELSLOEBENUMMER + mother)
      - custom: or
        function: find_duplicated_ids
        args: 
          table: ${paths.input_dir_SDS}/mfr.csv
          match_on: CPR_BARN
          id_columns: 
          - FOEDSELSLOEBENUMMER
          - CPR_MODER
