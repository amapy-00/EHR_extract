# =====================================================================================
# DATASET: new_September  ->  results in /home/am/Documents/output_cohort/filtering_steps_SDS/new_September
# steps_SDS_8_parity_new_September
# Step-by-step cohort size: SDS data only, NO image filtering, NO GA-range criterion.
# Step 8 of 8. Criteria applied (cumulative, in this order):
#   1. GA available at birth
#   2. Only live births
#   3. No iatrogenic preterm C-section
#   4. No iatrogenic preterm induction
#   5. No multiple births
#   6. No cervical cerclage
#   7. No progesterone treatment
#   8. First birth only (parity 1 in SDS)
# Run: python EHR_extract/extract.py --config-name steps_SDS_8_parity_new_September
# =====================================================================================
# @package _global_
defaults:
  - /default@
  - _self_

paths:
  input_dir_SDS: /home/am/data/raw/sds
  output_dir: /home/am/Documents/output_cohort/filtering_steps_SDS/new_September/${hydra:job.config_name}
  population_save_path: /home/am/Documents/output_cohort/filtering_steps_SDS/new_September/${hydra:job.config_name}_population
  discards_save_path: /home/am/Documents/output_cohort/filtering_steps_SDS/new_September/${hydra:job.config_name}_discards
  holdout_csv: 

strict: True
preterm_cutoff: 259  # == 37 weeks. Used by the C-section and induction criteria.

population: 
  population_key: CPR_BARN
  split_key: CPR_MOR
  file_path_key: FILE_PATH
  deduplication_key: CPR_BARN
  tables: 
    - table: ${paths.input_dir_SDS}/mfr.csv
      columns:
        CPR_BARN: CPR_BARN
        CPR_MOR: CPR_MODER
        GA: GESTATIONSALDER_DAGE
        BIRTHDAY: FOEDSELSDATO
    - table: ${paths.input_dir_SDS}/nyfoedte.csv
      columns:
        CPR_BARN: CPRnummer_Barn
        CPR_MOR: CPRnummer_Mor
        GA: Gestationsalder
        BIRTHDAY: FoedselsDato_Barn

# Prescription register (epikur_1/2/3.csv) - column names used by the progesterone criterion.
# Check them with:  head -1 /home/am/data/raw/sds/epikur_1.csv
epikur_mother_column: cpr      # mother's pseudonymised CPR (same IDs as CPR_MODER / CPRnummer_Mor)
epikur_date_column: eksd       # date the prescription was dispensed (format YYYY-MM-DD)

conditional_criteria:
  # ======================================================================================
  # CRITERION 1/8: GA available at birth  (1 OR-group, action: exclude)
  # ======================================================================================
  # GA available at birth
  - action: exclude
    conditions: 
      # --- [1.1] OR-group 1/1: population: GA missing
      - standard:
        table: population
        match_on: CPR_BARN
        column: GA
        operator: "missing"
        value: 
  # ======================================================================================
  # CRITERION 2/8: Only live births  (2 OR-groups, action: exclude)
  # ======================================================================================
  # Only live birth (no SP)
  - action: exclude
    conditions:
      # --- [2.1] OR-group 1/2: mfr: not live-born
      - standard:
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: LEVENDE_ELLER_DOEDFOEDT
        operator: "!="
        value: Levendefødt  # == live birth
      # --- [2.2] OR-group 2/2: nyfoedte: not live-born (1 = live)
      - standard: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: LevendefoedtDoedfoedt  # == live-born/still-born
        operator: "!="
        value: "1"
  # ======================================================================================
  # CRITERION 3/8: No iatrogenic preterm C-section  (3 OR-groups, action: exclude)
  # ======================================================================================
  # No C-section/kejsersnit unless PPROM or Contractions or C-section during birth
  - action: exclude
    conditions:
      # --- [3.1] OR-group 1/3: nyfoedte C-section (Kejsersnit != -1) AND preterm AND no PPROM/labour/intrapartum-CS code
      - standard:
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Kejsersnit  # == C-section
        operator: "!="
        value: "-1"
      - standard: and
        table: population
        match_on: CPR_BARN
        column: GA
        operator: <
        value: ${preterm_cutoff}
      - custom: and 
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: [DO420, DO422, DO424, DO601, KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/mor_diagnoser.csv
          value_column: DiagnoseKode
          # DW_EK_Foedsel: Key used to identify each individual birth. The key can be used 
          # to link to data in the satellite tables for the mother. For reports concerning 
          # unique births (as opposed to unique newborns), the main table must be filtered 
          # to ‘Foedsel = 1’.
          value_table_birth_id_column: DW_EK_Foedsel
          mapping_table_path: ${paths.input_dir_SDS}/nyfoedte.csv
          mapping_table_birth_id_column: DW_EK_Foedsel
          mapping_table_child_cpr_column: CPRnummer_Barn
      - custom: and 
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: [DO420, DO422, DO424, DO601, KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/mor_procedurer.csv
          value_column: ProcedureKode
          value_table_birth_id_column: DW_EK_Foedsel
          mapping_table_path: ${paths.input_dir_SDS}/nyfoedte.csv
          mapping_table_birth_id_column: DW_EK_Foedsel
          mapping_table_child_cpr_column: CPRnummer_Barn
      - custom: and 
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args: 
          value: [DO420, DO422, DO424, DO601, KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/t_diag.csv
          value_column: C_DIAG
          value_id_column: V_RECNUM
          value_time_column: D_INDDTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      - custom: and 
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args: 
          value: [DO420, DO422, DO424, DO601, KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/t_diag.csv
          value_column: C_TILDIAG
          value_id_column: V_RECNUM
          value_time_column: D_INDDTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      - custom: and 
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args: 
          value: [KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/t_sksopr.csv
          value_column: C_OPR
          value_id_column: V_RECNUM
          value_time_column: D_ODTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      - custom: and 
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args: 
          value: [DO420, DO422, DO424, KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/t_sksopr.csv
          value_column: C_TILOPR
          value_id_column: V_RECNUM
          value_time_column: D_ODTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      # --- [3.2] OR-group 2/3: mfr C-section marker AND preterm AND no PPROM code
      - standard: or
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: MARKOER_KEJSERSNIT
        operator: "=="
        value: "1"
      - standard: and
        table: population
        match_on: CPR_BARN
        column: GA
        operator: <
        value: ${preterm_cutoff}
      - standard: and
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: PPROM
        operator: not_in
        value: [DO420, DO422, DO424]
      - custom: and 
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args: 
          value: [DO420, DO422, DO424, DO601, KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/t_diag.csv
          value_column: C_DIAG
          value_id_column: V_RECNUM
          value_time_column: D_INDDTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      - custom: and 
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args: 
          value: [DO420, DO422, DO424, DO601, KMCA10D, KMCA10E]
          operator: [not_in, all]
          value_table_path: ${paths.input_dir_SDS}/t_diag.csv
          value_column: C_TILDIAG
          value_id_column: V_RECNUM
          value_time_column: D_INDDTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      # --- [3.3] OR-group 3/3: LPR operation code starting KMCA AND preterm AND no PPROM/labour/intrapartum-CS code
      - custom: or
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
