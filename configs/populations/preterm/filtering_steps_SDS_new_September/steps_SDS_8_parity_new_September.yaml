  # ======================================================================================
  # CRITERION 5/8: No multiple births  (2 OR-groups, action: exclude)
  # ======================================================================================
  # Remove multiple births (twins etc.)
  - action: exclude
    conditions:
      # --- [5.1] OR-group 1/2: nyfoedte: twins (shared DW_EK_Foedsel + mother)
      - custom:
        function: find_duplicated_ids
        args: 
          table: ${paths.input_dir_SDS}/nyfoedte.csv
          match_on: CPRnummer_Barn
          id_columns: 
          - DW_EK_Foedsel
          - CPRnummer_Mor
      # --- [5.2] OR-group 2/2: mfr: twins (shared FOEDSELSLOEBENUMMER + mother)
      - custom: or
        function: find_duplicated_ids
        args: 
          table: ${paths.input_dir_SDS}/mfr.csv
          match_on: CPR_BARN
          id_columns: 
          - FOEDSELSLOEBENUMMER
          - CPR_MODER
  # ======================================================================================
  # CRITERION 6/8: No cervical cerclage  (4 OR-groups, action: exclude)
  # ======================================================================================
  # Excluded if, during the pregnancy (birth date - GA up to birth date), any of these is recorded:
  #   diagnosis DO343C                  in mor_diagnoser.DiagnoseKode, t_diag.C_DIAG
  #   procedure KLDD10A, KLDD10B, KMAB00, KMAB01, KLDD20, KMAB03
  #                                     in mor_procedurer.ProcedureKode, t_sksopr.C_OPR
  - action: exclude
    conditions:
      # --- [6.1] OR-group 1/4: mor_diagnoser DiagnoseKode == DO343C
      - custom:
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: "DO343C"
          operator: ["==", any]
          value_table_path: ${paths.input_dir_SDS}/mor_diagnoser.csv
          value_column: DiagnoseKode
          value_table_birth_id_column: DW_EK_Foedsel
          mapping_table_path: ${paths.input_dir_SDS}/nyfoedte.csv
          mapping_table_birth_id_column: DW_EK_Foedsel
          mapping_table_child_cpr_column: CPRnummer_Barn
      # --- [6.2] OR-group 2/4: t_diag C_DIAG == DO343C
      - custom: or
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args:
          value: "DO343C"
          operator: ["==", any]
          value_table_path: ${paths.input_dir_SDS}/t_diag.csv
          value_column: C_DIAG
          value_id_column: V_RECNUM
          value_time_column: D_INDDTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      # --- [6.3] OR-group 3/4: mor_procedurer ProcedureKode in cerclage codes
      - custom: or
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: [KLDD10A, KLDD10B, KMAB00, KMAB01, KLDD20, KMAB03]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SDS}/mor_procedurer.csv
          value_column: ProcedureKode
          value_table_birth_id_column: DW_EK_Foedsel
          mapping_table_path: ${paths.input_dir_SDS}/nyfoedte.csv
          mapping_table_birth_id_column: DW_EK_Foedsel
          mapping_table_child_cpr_column: CPRnummer_Barn
      # --- [6.4] OR-group 4/4: t_sksopr C_OPR in cerclage codes
      - custom: or
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args:
          value: [KLDD10A, KLDD10B, KMAB00, KMAB01, KLDD20, KMAB03]
          operator: [in, any]
          value_table_path: ${paths.input_dir_SDS}/t_sksopr.csv
          value_column: C_OPR
          value_id_column: V_RECNUM
          value_time_column: D_ODTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
  # ======================================================================================
  # CRITERION 7/8: No progesterone treatment  (5 OR-groups, action: exclude)
  # ======================================================================================
  # Excluded if, during the pregnancy, any of these is recorded:
  #   prescription with ATC starting G03DA04 (progesterone)   in epikur_1/2/3.atc
  #   BKHA1 (behandling med progesteron under graviditet)      in t_sksube.C_TILOPR, mor_diagnoser.DiagnoseKode
  # The epikur column names for the mother ID and the prescription date are set ONCE at the top of
  # this file (epikur_mother_column, epikur_date_column).
  - action: exclude
    conditions:
      # --- [7.1] OR-group 1/5: epikur_1 atc starts with G03DA04
      - custom:
        function: match_value_with_child_cpr_on_birthdate
        args:
          value: "G03DA04"
          operator: [startswith, any]
          value_table_path: ${paths.input_dir_SDS}/epikur_1.csv
          value_column: atc
          value_time_column: ${epikur_date_column}
          value_mother_cpr_column: ${epikur_mother_column}
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mother_cpr_column: CPR_MOR
      # --- [7.2] OR-group 2/5: epikur_2 atc starts with G03DA04
      - custom: or
        function: match_value_with_child_cpr_on_birthdate
        args:
          value: "G03DA04"
          operator: [startswith, any]
          value_table_path: ${paths.input_dir_SDS}/epikur_2.csv
          value_column: atc
          value_time_column: ${epikur_date_column}
          value_mother_cpr_column: ${epikur_mother_column}
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mother_cpr_column: CPR_MOR
      # --- [7.3] OR-group 3/5: epikur_3 atc starts with G03DA04
      - custom: or
        function: match_value_with_child_cpr_on_birthdate
        args:
          value: "G03DA04"
          operator: [startswith, any]
          value_table_path: ${paths.input_dir_SDS}/epikur_3.csv
          value_column: atc
          value_time_column: ${epikur_date_column}
          value_mother_cpr_column: ${epikur_mother_column}
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mother_cpr_column: CPR_MOR
      # --- [7.4] OR-group 4/5: t_sksube C_TILOPR == BKHA1
      - custom: or
        function: match_value_with_child_cpr_on_lpr_id_to_mom_cpr_to_birthdate
        args:
          value: "BKHA1"
          operator: ["==", any]
          value_table_path: ${paths.input_dir_SDS}/t_sksube.csv
          value_column: C_TILOPR
          value_id_column: V_RECNUM
          value_time_column: D_ODTO
          mapping_table_path: ${paths.input_dir_SDS}/t_adm.csv
          mapping_table_id_column: K_RECNUM
          mapping_table_mom_cpr_column: V_CPR
          population_birth_column: BIRTHDAY
          population_gestational_age_column: GA
          population_child_cpr_column: CPR_BARN
          population_mom_cpr_column: CPR_MOR
      # --- [7.5] OR-group 5/5: mor_diagnoser DiagnoseKode == BKHA1
      - custom: or
        function: match_value_with_child_cpr_on_birth_id
        args:
          value: "BKHA1"
          operator: ["==", any]
          value_table_path: ${paths.input_dir_SDS}/mor_diagnoser.csv
          value_column: DiagnoseKode
          value_table_birth_id_column: DW_EK_Foedsel
          mapping_table_path: ${paths.input_dir_SDS}/nyfoedte.csv
          mapping_table_birth_id_column: DW_EK_Foedsel
          mapping_table_child_cpr_column: CPRnummer_Barn
  # ======================================================================================
  # CRITERION 8/8: Only first pregnancy (parity 1)  (2 OR-groups, action: exclude)
  # ======================================================================================
  # First birth only (nulliparous, i.e. parity 0 before this birth).
  # In SDS this is coded as 1 (= this is the woman's 1st birth), so anything other than 1 is excluded.
  # NB: `!=` never matches empty cells, so children with no parity recorded are KEPT; "." is excluded.
  - action: exclude
    conditions:
      # --- [8.1] OR-group 1/2: mfr: PARITET != 1
      - standard: 
        table: ${paths.input_dir_SDS}/mfr.csv
        match_on: CPR_BARN
        column: PARITET
        operator: "!="
        value: "1"
      # --- [8.2] OR-group 2/2: nyfoedte: Paritet != 1
      - standard: or
        table: ${paths.input_dir_SDS}/nyfoedte.csv
        match_on: CPRnummer_Barn
        column: Paritet
        operator: "!="
        value: "1"
