# =====================================================================================
# DATASET: new_September  ->  results in /home/am/Documents/output_cohort/filtering_steps_SDS/new_September
# steps_SDS_img_6_parity_new_September
# Image pairing for the population of steps_SDS_6_parity_new_September.
# The population is loaded from the saved output of steps_SDS_6_parity_new_September, so the register criteria
# are NOT recomputed. Criteria already applied in that population:
#   1. GA available at birth
#   2. Only live births
#   3. No iatrogenic preterm C-section
#   4. No iatrogenic preterm induction
#   5. No multiple births
#   6. First birth only (parity 1 in SDS)
# Here: each child is paired with all of the mother's ultrasound images taken during that
# pregnancy (birth date - GA up to birth date). No GA-at-scan or cervix filtering: those are
# counted afterwards by image_step_summary.py.
# Prerequisite: steps_SDS_6_parity_new_September has been run. Re-run this config whenever steps_SDS_6_parity_new_September changes.
# Run: python EHR_extract/extract.py --config-name steps_SDS_img_6_parity_new_September
# =====================================================================================
# @package _global_
defaults:
  - /default@
  - _self_

paths:
  input_dir_SDS: /home/am/data/raw/sds
  output_dir: /home/am/Documents/output_cohort/filtering_steps_SDS/new_September/with_images/${hydra:job.config_name}
  population_save_path: /home/am/Documents/output_cohort/filtering_steps_SDS/new_September/with_images/${hydra:job.config_name}_population
  discards_save_path: /home/am/Documents/output_cohort/filtering_steps_SDS/new_September/with_images/${hydra:job.config_name}_discards
  holdout_csv: 
  imaging_table: /home/am/Documents/DeepFetalCSVs/new_September/DeepFetal_image_database_090926_joined_on_sop_instance_uid_and_xx-file_hash.csv

strict: True

population:
  population_key: CPR_BARN
  split_key: CPR_MOR
  file_path_key: FILE_PATH
  deduplication_key: CPR_BARN
  tables:
    - table: /home/am/Documents/output_cohort/filtering_steps_SDS/new_September/steps_SDS_6_parity_new_September_population_train_and_test.csv
      columns:
        CPR_BARN: CPR_BARN
        CPR_MOR: CPR_MOR
        GA: GA
        BIRTHDAY: BIRTHDAY

# Criteria already applied in the input population above.
conditional_criteria: []

imaging_table:
  table: ${paths.imaging_table}
  columns:
    CPR_MOR: phair_hash
    FILE_PATH: file_path
    STUDY_DATE: study_date
    PDX: physical_delta_x
    PDY: physical_delta_y
    NO_OCR_FILE_PATH: no_ocr_preprocessed_file_path
    INSTITUTION_NAME: institution_name
