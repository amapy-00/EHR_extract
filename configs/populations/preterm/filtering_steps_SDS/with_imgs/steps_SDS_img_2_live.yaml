# =====================================================================================
# steps_SDS_img_2_live
# Image pairing for the population of steps_SDS_2_live.
# The population is loaded from the saved output of steps_SDS_2_live, so the register criteria
# are NOT recomputed. Criteria already applied in that population:
#   1. GA available at birth
#   2. Only live births
# Here: each child is paired with all of the mother's ultrasound images taken during that
# pregnancy (birth date - GA up to birth date). No GA-at-scan or cervix filtering: those are
# counted afterwards by image_step_summary.py.
# Prerequisite: steps_SDS_2_live has been run. Re-run this config whenever steps_SDS_2_live changes.
# Run: python EHR_extract/extract.py --config-name steps_SDS_img_2_live
# =====================================================================================
# @package _global_
defaults:
  - /default@
  - _self_

paths:
  input_dir_SDS: /home/am/data/raw/sds
  output_dir: /home/am/Documents/output_cohort/filtering_steps_SDS/with_images/${hydra:job.config_name}
  population_save_path: /home/am/Documents/output_cohort/filtering_steps_SDS/with_images/${hydra:job.config_name}_population
  discards_save_path: /home/am/Documents/output_cohort/filtering_steps_SDS/with_images/${hydra:job.config_name}_discards
  holdout_csv: 
  imaging_table: /home/am/Documents/DeepFetalCSVs/DeepFetal_image_database_250526_joined_on_sop_instance_uid.csv

strict: True

population:
  population_key: CPR_BARN
  split_key: CPR_MOR
  file_path_key: FILE_PATH
  deduplication_key: CPR_BARN
  tables:
    - table: ${oc.env:EHR_EXTRACT_OUTPUTS}/steps_SDS_2_live_population_train_and_test.csv
      columns:
        CPR_BARN: CPR_BARN
        CPR_MOR: CPR_MOR
        GA: GA
        BIRTHDAY: BIRTHDAY

# Criteria already applied in the input population above.
conditional_criteria: []

imaging_table:
  table: ${paths.imaging_table}
  columns:
    CPR_MOR: file_hash
    FILE_PATH: file_path
    STUDY_DATE: study_date
    PDX: physical_delta_x
    PDY: physical_delta_y
    NO_OCR_FILE_PATH: no_ocr_preprocessed_file_path
    INSTITUTION_NAME: institution_name
